# Alembic (database migrations). The app runs them by itself on start (database.migrate()).
# By hand, from backend/:
#   alembic upgrade head                                  apply all migrations
#   alembic revision --autogenerate -m "what changed"     draft a new one after changing a table
# The database comes from DATABASE_URL, as for the app (see database.py).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
