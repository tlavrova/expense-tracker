# Builds the Angular app and publishes it to GitHub Pages on every push to main:
# https://tlavrova.github.io/expense-tracker/
# Needs Settings → Pages → Source: "GitHub Actions" (set once).
name: Deploy frontend

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/deploy-frontend.yml"]
  workflow_dispatch: # "Run workflow" button, to redeploy by hand

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: # one deploy at a time; a newer push waits instead of cancelling a running deploy
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npx ng build # production: base href /expense-tracker/, environment.prod.ts
      # GitHub Pages has no fallback to index.html: refreshing /expense-tracker/summary would be a
      # 404. Its 404 page is the app itself, so the Angular router opens the right page.
      - run: cp dist/expense-tracker/browser/index.html dist/expense-tracker/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/expense-tracker/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
