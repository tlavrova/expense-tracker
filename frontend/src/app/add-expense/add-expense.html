<h1>Add expense</h1>

<form class="form" [formGroup]="form" (ngSubmit)="save()" novalidate>
  @if (serverError()) {
    <p class="error" role="alert">{{ serverError() }}</p>
  }

  <label class="field">
    <span>Description</span>
    <input formControlName="description" placeholder="Uber to airport" autocomplete="off" />
    @if (showError('description')) {
      <small class="field-error">Please describe the expense.</small>
    }
  </label>

  <label class="field">
    <span>Amount</span>
    <input
      formControlName="amount"
      type="number"
      inputmode="decimal"
      step="0.01"
      min="0.01"
      placeholder="32.50"
    />
    @if (showError('amount')) {
      <small class="field-error">
        {{
          form.controls.amount.hasError('positive')
            ? 'The amount must be greater than zero.'
            : 'Please enter an amount, for example 12.50.'
        }}
      </small>
    }
  </label>

  <label class="field">
    <span>Category</span>
    <input formControlName="category" list="categories" placeholder="food" autocomplete="off" />
    <datalist id="categories">
      @for (category of categories; track category) {
        <option [value]="category"></option>
      }
    </datalist>
    <small class="hint">Pick one or type your own.</small>
    @if (showError('category')) {
      <small class="field-error">Please choose or type a category.</small>
    }
  </label>

  <label class="field">
    <span>Date</span>
    <input formControlName="date" type="date" />
    @if (showError('date')) {
      <small class="field-error">Please choose a date.</small>
    }
  </label>

  <label class="field">
    <span>Repeats</span>
    <select formControlName="frequency">
      <option value="">No</option>
      @for (frequency of frequencies; track frequency) {
        <option [value]="frequency">{{ frequency }}</option>
      }
    </select>
  </label>

  <div class="buttons">
    <button type="submit" class="primary" [disabled]="saving()">
      {{ saving() ? 'Saving…' : 'Save' }}
    </button>
  </div>
</form>
