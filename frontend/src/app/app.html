<header class="header">
  <a class="brand" routerLink="/">Expense Tracker</a>
  @if (auth.loggedIn()) {
    <nav class="nav" aria-label="Main">
      <a
        routerLink="/expenses"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{
          paths: 'exact',
          queryParams: 'ignored',
          matrixParams: 'ignored',
          fragment: 'ignored',
        }"
        >Expenses</a
      >
      <a routerLink="/expenses/new" routerLinkActive="active">Add expense</a>
      <a routerLink="/summary" routerLinkActive="active">Summary</a>
    </nav>
    <div class="account">
      <a class="email" routerLink="/password" title="Change password">{{ auth.email() }}</a>
      <button type="button" class="logout" (click)="auth.logout()">Log out</button>
    </div>
  }
</header>

<main class="content">
  <router-outlet />
</main>
