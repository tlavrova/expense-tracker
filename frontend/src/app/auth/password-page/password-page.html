<div class="card">
  <h1>Change password</h1>

  @if (done()) {
    <p class="notice" role="status">Password changed. Use the new one next time you log in.</p>
  }

  <form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    <label class="field">
      <span>Current password</span>
      <input formControlName="current" type="password" autocomplete="current-password" />
      @if (showError('current')) {
        <small class="field-error">Please enter your current password.</small>
      }
    </label>

    <label class="field">
      <span>New password</span>
      <input formControlName="newPassword" type="password" autocomplete="new-password" />
      <small class="hint">At least {{ minPasswordLength }} characters.</small>
      @if (showError('newPassword')) {
        <small class="field-error">
          {{
            form.controls.newPassword.hasError('minlength')
              ? 'The new password needs at least ' + minPasswordLength + ' characters.'
              : 'Please enter a new password.'
          }}
        </small>
      }
    </label>

    <label class="field">
      <span>New password again</span>
      <input formControlName="repeat" type="password" autocomplete="new-password" />
      @if (showError('repeat')) {
        <small class="field-error">Please type the new password again.</small>
      } @else if (different()) {
        <small class="field-error">The two new passwords are different.</small>
      }
    </label>

    <button type="submit" class="primary" [disabled]="busy()">
      {{ busy() ? 'Saving…' : 'Change password' }}
    </button>
  </form>
</div>
